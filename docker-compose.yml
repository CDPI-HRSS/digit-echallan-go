version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - digit-net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - digit-net

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: digit
      POSTGRES_PASSWORD: password
      POSTGRES_DB: echallan
    ports:
      - "5432:5432"
    networks:
      - digit-net

  echallan-services:
    build:
      context: ./echallan-services
      dockerfile: deployments/Dockerfile
    ports:
      - "8079:8079"
    environment:
      - SERVER_PORT=8079
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=digit
      - DB_PASSWORD=password
      - DB_NAME=echallan
      - KAFKA_BROKERS=kafka:29092
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-digit}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-echallan-services}
    depends_on:
      - postgres
      - kafka
    networks:
      - digit-net

  echallan-calculator:
    build:
      context: ./echallan-calculator
      dockerfile: deployments/Dockerfile
    ports:
      - "8078:8078"
    environment:
      - SERVER_PORT=8078
      - EGOV_CHALLAN_HOST=http://echallan-services:8079
      - EGOV_BILLINGSERVICE_HOST=http://localhost:8081 # external mock
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-digit}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-echallan-calculator}
    depends_on:
      - echallan-services
    networks:
      - digit-net

networks:
  digit-net:
    driver: bridge
